[package]
authors = ["pleme-io"]
description = "lava-azurerm — autogenerated typed (deflava-resource …) shapes for the azurerm terraform provider. Mirrors pangea-azurerm. Source schema kept under schema.json; resources/*.tlisp + _index.tlisp regenerated via `lava-forge generate --schema schema.json --out resources`."
edition = "2024"
license = "MIT"
name = "lava-azurerm"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-azurerm"
version = "0.1.1"

[lib]
name = "lava_azurerm"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"
